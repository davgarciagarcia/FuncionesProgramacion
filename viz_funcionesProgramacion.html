<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tipos de parámetros — Visualizador</title>
<style>
:root {
  --bg:#f4f3ef;--sf:#fff;--sf2:#eceae4;
  --tx:#1a1917;--tx2:#5f5e5a;--tx3:#9a9890;
  --bd:rgba(0,0,0,.09);--bd2:rgba(0,0,0,.16);
  --ac:#185FA5;--ac-bg:#E6F1FB;--ac-dk:#0C447C;
  --fn:#0F6E56;--fn-bg:#E1F5EE;--fn-dk:#085041;
  --e-c:#3B6D11;--e-bg:#EAF3DE;--e-dk:#27500A;
  --s-c:#534AB7;--s-bg:#EEEDFE;--s-dk:#3C3489;
  --es-c:#185FA5;--es-bg:#E6F1FB;--es-dk:#0C447C;
  --rt-c:#993C1D;--rt-bg:#FAECE7;--rt-dk:#712B13;
  --r:8px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1a1917;--sf:#232220;--sf2:#2b2a27;
  --tx:#e6e4de;--tx2:#9a9890;--tx3:#6a6860;
  --bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.14);
  --ac:#4a9de0;--ac-bg:#042C53;--ac-dk:#85B7EB;
  --fn:#5DCAA5;--fn-bg:#04342C;--fn-dk:#9FE1CB;
  --e-c:#97C459;--e-bg:#173404;--e-dk:#C0DD97;
  --s-c:#AFA9EC;--s-bg:#26215C;--s-dk:#CECBF6;
  --es-c:#4a9de0;--es-bg:#042C53;--es-dk:#85B7EB;
  --rt-c:#F0997B;--rt-bg:#4A1B0C;--rt-dk:#F5C4B3;
}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;min-height:100vh;}
.page{max-width:920px;margin:0 auto;padding:1.25rem;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

/* selector */
.sel-bar{background:var(--sf);border:0.5px solid var(--bd2);border-radius:12px;padding:.75rem 1rem;margin-bottom:1.25rem;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;}
.sel-label{font-size:12px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;}
.sel-btn{padding:7px 16px;border:0.5px solid var(--bd2);border-radius:99px;background:none;color:var(--tx2);font-size:13px;font-weight:500;cursor:pointer;transition:all .18s;white-space:nowrap;}
.sel-btn:hover{background:var(--sf2);color:var(--tx);}
.sel-btn.aE{background:var(--e-bg);color:var(--e-dk);border-color:var(--e-c);}
.sel-btn.aS{background:var(--s-bg);color:var(--s-dk);border-color:var(--s-c);}
.sel-btn.aES{background:var(--es-bg);color:var(--es-dk);border-color:var(--es-c);}
.cfg{display:flex;align-items:center;gap:.5rem;font-size:13px;color:var(--tx2);margin-left:auto;}
input[type=number]{width:64px;padding:5px 8px;border:0.5px solid var(--bd2);border-radius:var(--r);background:var(--sf);color:var(--tx);font-size:13px;text-align:center;}

/* header */
.sc-head{display:flex;align-items:center;gap:.6rem;margin-bottom:1rem;flex-wrap:wrap;}
.sc-head h2{font-size:16px;font-weight:500;}
.badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;}

/* stage */
.stage{display:grid;grid-template-columns:1fr 116px 1fr;border:0.5px solid var(--bd2);border-radius:12px;overflow:hidden;background:var(--sf);}
.panel{padding:1.125rem;}
.p-algo{border-right:0.5px solid var(--bd2);}
.p-func{border-left:0.5px solid var(--bd2);}
.ptitle{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.75rem;}
.ptitle.ta{color:var(--ac);}
.ptitle.tf{color:var(--fn);}
.pbox{border:2px solid var(--bd2);border-radius:10px;padding:.75rem;transition:border-color .35s,box-shadow .35s;}
.pbox.ha{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 14%,transparent);}
.pbox.hf{border-color:var(--fn);box-shadow:0 0 0 4px color-mix(in srgb,var(--fn) 14%,transparent);}

/* containers — fixed IDs: a1,a2 (algo), f1,f2 (func) */
.vlbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);margin-bottom:.4rem;margin-top:.75rem;}
.vlbl:first-of-type{margin-top:0;}
.crow{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:.5rem;}
.ctag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;margin-bottom:3px;opacity:0;transition:opacity .3s;}
.ctag.show{opacity:1;}
.tE{background:var(--e-bg);color:var(--e-dk);}
.tS{background:var(--s-bg);color:var(--s-dk);}
.tES{background:var(--es-bg);color:var(--es-dk);}
.tret{background:var(--rt-bg);color:var(--rt-dk);}
.cwrap{display:flex;flex-direction:column;align-items:center;}
.clid{width:60px;height:9px;background:var(--sf2);border:1.5px solid var(--bd2);border-bottom:none;border-radius:4px 4px 0 0;transition:all .3s;}
.cbody{width:60px;height:54px;border:1.5px solid var(--bd2);border-radius:0 0 6px 6px;background:var(--sf2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;transition:all .3s;}
.cval{font-size:19px;font-weight:700;font-family:monospace;color:var(--tx);transition:color .3s;}
.cname{font-size:10px;color:var(--tx3);font-weight:500;position:absolute;bottom:3px;}
/* highlight states applied via JS to .cwrap */
.cwrap.dim .cbody,.cwrap.dim .clid{opacity:.22;}
.cwrap.hA .cbody{border-color:var(--ac);background:var(--ac-bg);} .cwrap.hA .cval{color:var(--ac-dk);} .cwrap.hA .clid{border-color:var(--ac);}
.cwrap.hE .cbody{border-color:var(--e-c);background:var(--e-bg);} .cwrap.hE .cval{color:var(--e-dk);} .cwrap.hE .clid{border-color:var(--e-c);}
.cwrap.hS .cbody{border-color:var(--s-c);background:var(--s-bg);} .cwrap.hS .cval{color:var(--s-dk);} .cwrap.hS .clid{border-color:var(--s-c);}
.cwrap.hES .cbody{border-color:var(--es-c);background:var(--es-bg);} .cwrap.hES .cval{color:var(--es-dk);} .cwrap.hES .clid{border-color:var(--es-c);}
.cwrap.hF .cbody{border-color:var(--fn);background:var(--fn-bg);} .cwrap.hF .cval{color:var(--fn-dk);} .cwrap.hF .clid{border-color:var(--fn);}
.cwrap.hR .cbody{border-color:var(--rt-c);background:var(--rt-bg);} .cwrap.hR .cval{color:var(--rt-dk);} .cwrap.hR .clid{border-color:var(--rt-c);}

/* code */
.codeblk{background:var(--sf2);border:0.5px solid var(--bd2);border-radius:var(--r);padding:.6rem .875rem;font-family:monospace;font-size:12px;line-height:1.8;margin-top:.75rem;}
.cl{display:block;border-radius:3px;padding:0 3px;transition:background .25s;}
.cl.hla{background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac-dk);}
.cl.hlf{background:color-mix(in srgb,var(--fn) 16%,transparent);color:var(--fn-dk);}
.kw{color:var(--ac);font-weight:600;}
.kw2{color:var(--fn);font-weight:600;}
.fn{color:#854F0B;font-weight:600;}
.cm{color:var(--tx3);}
.tp{color:#534AB7;}
.fnote{font-size:11px;color:var(--tx3);margin-top:.6rem;line-height:1.45;min-height:1rem;}

/* channel */
.channel{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:.5rem;position:relative;}
.chwire{position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--bd2);transform:translateX(-50%);}
.pkt{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 9px;border-radius:var(--r);border:1.5px solid;font-size:11px;font-family:monospace;font-weight:600;text-align:center;z-index:1;min-width:84px;transition:opacity .35s,transform .35s;}
.pkt.hidden{opacity:0;transform:translateY(-5px);pointer-events:none;}
.pkt.show{opacity:1;transform:none;}
.pkE{background:var(--e-bg);border-color:var(--e-c);color:var(--e-dk);}
.pkS{background:var(--s-bg);border-color:var(--s-c);color:var(--s-dk);}
.pkES{background:var(--es-bg);border-color:var(--es-c);color:var(--es-dk);}
.pkR{background:var(--rt-bg);border-color:var(--rt-c);color:var(--rt-dk);}
.pkt-type{font-size:10px;opacity:.75;font-weight:700;letter-spacing:.05em;}
.pkt-icon{font-size:15px;line-height:1;}
.pkt-val{font-size:13px;}

/* message */
.msgbox{background:var(--sf);border:0.5px solid var(--bd2);border-radius:10px;padding:.875rem 1.125rem;margin-top:.875rem;}
.msgstep{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);margin-bottom:3px;}
.msgtitle{font-size:14px;font-weight:500;margin-bottom:3px;}
.msgdesc{font-size:13px;color:var(--tx2);line-height:1.55;}

/* controls */
.ctrlrow{display:flex;align-items:center;gap:.75rem;margin-top:.875rem;flex-wrap:wrap;}
.btn{padding:7px 18px;border:0.5px solid var(--bd2);border-radius:var(--r);background:var(--sf);color:var(--tx);font-size:13px;font-weight:500;cursor:pointer;transition:background .15s;}
.btn:hover{background:var(--sf2);}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn.primary{background:var(--ac);color:#fff;border-color:var(--ac);}
.btn.primary:hover{opacity:.88;}
.dotrow{display:flex;gap:5px;align-items:center;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bd2);transition:background .2s;}
.dot.done{background:var(--ac);}
.dot.cur{background:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent);}
</style>
</head>
<body>
<div class="page">
<h2 class="sr-only">Visualizador interactivo de tipos de parámetros en funciones</h2>

<div class="sel-bar">
  <span class="sel-label">Tipo de parámetro:</span>
  <button class="sel-btn" id="btnE" onclick="selectSc('E')">📥 E — Entrada + retorno</button>
  <button class="sel-btn" id="btnS" onclick="selectSc('S')">📤 S — Salida</button>
  <button class="sel-btn" id="btnES" onclick="selectSc('ES')">🔄 E/S — Entrada y Salida</button>
  <div class="cfg">
    <label>Valor de <code>n</code>:</label>
    <input type="number" id="cfgN" value="5" min="1" max="99" step="1" oninput="resetCur()">
    <button class="btn" onclick="resetCur()">↺</button>
  </div>
</div>

<div class="sc-head">
  <h2 id="scTitle"></h2>
  <span class="badge" id="scB1"></span>
  <span class="badge" id="scB2"></span>
</div>

<div class="stage">
  <div class="panel p-algo">
    <div class="ptitle ta">Algoritmo principal</div>
    <div class="pbox" id="boxA">
      <div class="vlbl">Variables del algoritmo</div>
      <div class="crow" id="algoVars"></div>
      <div class="codeblk" id="codeA"></div>
    </div>
  </div>
  <div class="channel">
    <div class="chwire"></div>
    <div class="pkt hidden" id="pkt1"></div>
    <div class="pkt hidden" id="pkt2"></div>
  </div>
  <div class="panel p-func">
    <div class="ptitle tf" id="funcTitle">Función</div>
    <div class="pbox" id="boxF">
      <div class="vlbl">Variables de la función</div>
      <div class="crow" id="funcVars"></div>
      <div class="codeblk" id="codeF"></div>
      <div class="fnote" id="funcNote"></div>
    </div>
  </div>
</div>

<div class="msgbox">
  <div class="msgstep" id="msgStep"></div>
  <div class="msgtitle" id="msgTitle"></div>
  <div class="msgdesc" id="msgDesc"></div>
</div>

<div class="ctrlrow">
  <button class="btn" id="btnPrev" onclick="go(-1)" disabled>← Anterior</button>
  <button class="btn primary" id="btnNext" onclick="go(1)">Siguiente paso →</button>
  <div class="dotrow" id="dotrow"></div>
</div>
</div>

<script>
// ── Fixed container IDs: a1,a2 in algo; f1,f2 in func
// ── Fixed code line IDs: al0..al9, fl0..fl9
// These never change between scenarios — only their content changes.

const g = id => document.getElementById(id);
const setH = (id,h) => { const e=g(id); if(e) e.innerHTML=h; };
const setT = (id,t) => { const e=g(id); if(e) e.textContent=t; };

// Build a container's HTML with fixed IDs
function makeCtr(slotId, name, val, tag=''){
  const tagHtml = tag ? `<span class="ctag show t${tag}">${tag}</span>` : `<span class="ctag"></span>`;
  return `<div style="display:flex;flex-direction:column;align-items:center;">
    ${tagHtml}
    <div class="cwrap" id="cw-${slotId}">
      <div class="clid"></div>
      <div class="cbody">
        <span class="cval" id="cv-${slotId}">${val}</span>
        <span class="cname">${name}</span>
      </div>
    </div>
  </div>`;
}

// Set container highlight — always works because IDs are fixed
function hiCtr(slotId, state){
  const e = g('cw-'+slotId);
  if(!e) return;
  e.className = 'cwrap' + (state ? ' '+state : '');
}
function valCtr(slotId, v){ setT('cv-'+slotId, v); }

// Code lines — fixed IDs al0..al9, fl0..fl9
function buildCode(containerId, lines){
  // lines: array of [localId, html]  — localId maps to al0..al9 / fl0..fl9
  setH(containerId, lines.map(([id,h])=>`<span class="cl" id="${id}">${h}</span>`).join(''));
}
function clrHL(){
  for(let i=0;i<10;i++){
    ['al'+i,'fl'+i].forEach(id=>{const e=g(id);if(e)e.className='cl';});
  }
}
function hl(id, type){ // type: 'a' or 'f'
  const e=g(id); if(!e)return;
  e.className='cl hl'+type;
}
function boxHi(a,f){
  g('boxA').className='pbox'+(a?' ha':'');
  g('boxF').className='pbox'+(f?' hf':'');
}
function showPkt(slot, show, cls, typeStr, icon, val){
  const e=g('pkt'+slot); if(!e)return;
  e.className='pkt '+(show?'show':'hidden')+(cls?' '+cls:'');
  if(show) e.innerHTML=`<span class="pkt-type">${typeStr}</span><span class="pkt-icon">${icon}</span><span class="pkt-val">${val}</span>`;
}
function clearPkts(){ showPkt(1,false); showPkt(2,false); }
function setNote(h){ setH('funcNote', h||''); }
function setMsg(s,tot,title,desc){
  setT('msgStep',`Paso ${s} de ${tot-1}`);
  setT('msgTitle', title);
  setH('msgDesc', desc);
}
function renderDots(cur,tot){
  g('dotrow').innerHTML=Array.from({length:tot},(_,i)=>
    `<div class="dot${i<cur?' done':i===cur?' cur':''}"></div>`).join('');
}

// ── nVal
const nVal = () => parseInt(g('cfgN').value)||5;

// ════════════════════════════════
//  SCENARIO DEFINITIONS
//  Each scenario returns {TOTAL, init, steps[]}
//  init() rebuilds DOM (containers + code) with fixed IDs
//  steps[i]() only sets highlights/values/packets/messages
// ════════════════════════════════

function scenE(){
  const n=nVal(), r=n*2, TOTAL=6;

  function init(){
    setH('algoVars', makeCtr('a1','n',n,'')+makeCtr('a2','resultado','?',''));
    setH('funcVars', makeCtr('f1','x','?','E')+makeCtr('f2','x*2','?','ret'));
    buildCode('codeA',[
      ['al0','<span class="kw">algoritmo</span> Principal'],
      ['al1','<span class="kw">var</span>  <span class="tp">entero</span>: n, resultado'],
      ['al2','<span class="kw">inicio</span>'],
      ['al3',`  n <span class="kw">&lt;--</span> ${n}`],
      ['al4',`  resultado <span class="kw">&lt;--</span> <span class="fn">doble</span>(n)`],
      ['al5','  <span class="kw">escribir</span>(resultado)'],
      ['al6','<span class="kw">fin</span>'],
    ]);
    buildCode('codeF',[
      ['fl0','<span class="kw2">entero</span> <span class="kw2">funcion</span> <span class="fn">doble</span> (<span class="kw">E</span> <span class="tp">entero</span>: x)'],
      ['fl1','<span class="kw2">inicio</span>'],
      ['fl2','  <span class="kw2">devolver</span>(x * 2)'],
      ['fl3','<span class="kw2">fin_funcion</span>'],
    ]);
    setT('funcTitle','Función doble');
    clearPkts(); setNote(''); clrHL(); boxHi(false,false);
  }

  const steps=[
    ()=>{ clrHL();clearPkts();setNote('');
      valCtr('a1',n);valCtr('a2','?');valCtr('f1','?');valCtr('f2','?');
      hiCtr('a1','hA');hiCtr('a2','');hiCtr('f1','dim');hiCtr('f2','dim');
      hl('al1','a');hl('al2','a');hl('al3','a');boxHi(true,false);
      setMsg(0,TOTAL,'Variables del algoritmo declaradas',`El algoritmo asigna <code>n = ${n}</code>. <code>resultado</code> existe pero sin valor útil aún. La función <strong>doble</strong> no ha sido invocada — sus variables no existen todavía.`);
    },
    ()=>{ clrHL();clearPkts();setNote('');
      valCtr('a1',n);valCtr('a2','?');valCtr('f1','?');valCtr('f2','?');
      hiCtr('a1','hE');hiCtr('a2','');hiCtr('f1','dim');hiCtr('f2','dim');
      hl('al4','a');boxHi(true,false);
      setMsg(1,TOTAL,'El algoritmo llama a doble(n)',`Se ejecuta <code>resultado &lt;-- doble(n)</code>. El algoritmo prepara una <strong>copia</strong> del valor de <code>n</code> para enviársela a la función.`);
    },
    ()=>{ clrHL();clearPkts();setNote('');
      valCtr('a1',n);valCtr('a2','?');valCtr('f1','?');valCtr('f2','?');
      hiCtr('a1','hE');hiCtr('a2','dim');hiCtr('f1','dim');hiCtr('f2','dim');
      showPkt(1,true,'pkE','E →','📦',`copia: ${n}`);
      hl('al4','a');hl('fl0','f');boxHi(true,true);
      setMsg(2,TOTAL,'La copia del valor viaja a la función',`Se crea una copia del valor ${n} y se entrega al parámetro <code>x</code>. El contenedor <code>n</code> del algoritmo no se mueve — la función <strong>no puede verlo ni tocarlo</strong>.`);
    },
    ()=>{ clrHL();clearPkts();
      valCtr('a1',n);valCtr('a2','?');valCtr('f1',n);valCtr('f2',r);
      hiCtr('a1','dim');hiCtr('a2','dim');hiCtr('f1','hE');hiCtr('f2','hF');
      hl('fl1','f');hl('fl2','f');boxHi(false,true);
      setNote('La función <strong>no puede ver</strong> las variables del algoritmo.');
      setMsg(3,TOTAL,'La función calcula x * 2',`Dentro de la función, <code>x = ${n}</code> (la copia recibida). Calcula <code>x * 2 = ${r}</code>. Los contenedores del algoritmo están <strong>inaccesibles</strong> desde aquí.`);
    },
    ()=>{ clrHL();clearPkts();setNote('');
      valCtr('a1',n);valCtr('a2','?');valCtr('f1',n);valCtr('f2',r);
      hiCtr('a1','dim');hiCtr('a2','hR');hiCtr('f1','dim');hiCtr('f2','dim');
      showPkt(2,true,'pkR','← devolver','📤',r);
      hl('fl2','f');hl('al4','a');boxHi(true,true);
      setMsg(4,TOTAL,'devolver() envía el resultado al algoritmo',`La función devuelve ${r}. No modifica nada en el algoritmo — simplemente entrega un valor que el algoritmo asigna a <code>resultado</code>.`);
    },
    ()=>{ clrHL();clearPkts();setNote('');
      valCtr('a1',n);valCtr('a2',r);valCtr('f1','?');valCtr('f2','?');
      hiCtr('a1','hA');hiCtr('a2','hR');hiCtr('f1','dim');hiCtr('f2','dim');
      hl('al5','a');boxHi(true,false);
      setMsg(5,TOTAL,`Listo — n sigue valiendo ${n}`,`<code>resultado = ${r}</code>. Lo clave: <code>n</code> sigue valiendo ${n}. Al ser parámetro <strong>E</strong>, solo viajó una <em>copia</em> del valor — el contenedor original nunca fue tocado por la función.`);
    },
  ];
  return {TOTAL, init, steps};
}

function scenS(){
  const n=nVal(), r=n*3, TOTAL=6;

  function init(){
    setH('algoVars', makeCtr('a1','n',n,'')+makeCtr('a2','resultado','?',''));
    setH('funcVars', makeCtr('f1','x','?','E')+makeCtr('f2','res','?','S'));
    buildCode('codeA',[
      ['al0','<span class="kw">algoritmo</span> Principal'],
      ['al1','<span class="kw">var</span>  <span class="tp">entero</span>: n, resultado'],
      ['al2','<span class="kw">inicio</span>'],
      ['al3',`  n <span class="kw">&lt;--</span> ${n}`],
      ['al4',`  <span class="fn">triple</span>(n, resultado)`],
      ['al5','  <span class="kw">escribir</span>(resultado)'],
      ['al6','<span class="kw">fin</span>'],
    ]);
    buildCode('codeF',[
      ['fl0','<span class="kw2">void</span> <span class="kw2">funcion</span> <span class="fn">triple</span>'],
      ['fl1','  (<span class="kw">E</span> <span class="tp">entero</span>: x; <span class="kw">S</span> <span class="tp">entero</span>: res)'],
      ['fl2','<span class="kw2">inicio</span>'],
      ['fl3',`  res <span class="kw">&lt;--</span> x * 3`],
      ['fl4','<span class="kw2">fin_funcion</span>'],
    ]);
    setT('funcTitle','Función triple');
    clearPkts(); setNote(''); clrHL(); boxHi(false,false);
  }

  const steps=[
    ()=>{ clrHL();clearPkts();setNote('');
      valCtr('a1',n);valCtr('a2','?');valCtr('f1','?');valCtr('f2','?');
      hiCtr('a1','hA');hiCtr('a2','');hiCtr('f1','dim');hiCtr('f2','dim');
      hl('al1','a');hl('al2','a');hl('al3','a');boxHi(true,false);
      setMsg(0,TOTAL,'Variables del algoritmo declaradas',`<code>n = ${n}</code>. El contenedor <code>resultado</code> existe pero aún sin valor útil. La función <strong>triple</strong> no ha sido invocada.`);
    },
    ()=>{ clrHL();clearPkts();setNote('');
      valCtr('a1',n);valCtr('a2','?');valCtr('f1','?');valCtr('f2','?');
      hiCtr('a1','hE');hiCtr('a2','hS');hiCtr('f1','dim');hiCtr('f2','dim');
      hl('al4','a');boxHi(true,false);
      setMsg(1,TOTAL,'El algoritmo llama a triple(n, resultado)',`Se pasan dos argumentos: <code>n</code> como parámetro <strong>E</strong> (copia del valor) y <code>resultado</code> como parámetro <strong>S</strong>. La función recibirá una referencia al contenedor — lo que escriba en <code>res</code> aparecerá directamente en <code>resultado</code>.`);
    },
    ()=>{ clrHL();clearPkts();setNote('');
      valCtr('a1',n);valCtr('a2','?');valCtr('f1','?');valCtr('f2','?');
      hiCtr('a1','hE');hiCtr('a2','hS');hiCtr('f1','dim');hiCtr('f2','dim');
      showPkt(1,true,'pkE','E →','📦',`copia: ${n}`);
      showPkt(2,true,'pkS','S →','🔗','ref: resultado');
      hl('al4','a');hl('fl0','f');hl('fl1','f');boxHi(true,true);
      setMsg(2,TOTAL,'Dos cosas viajan a la función',`Una <strong>copia</strong> del valor de <code>n</code> va al parámetro <code>x</code>. Una <strong>referencia</strong> al contenedor <code>resultado</code> va al parámetro <code>res</code>: ambos apuntan al mismo sitio en memoria.`);
    },
    ()=>{ clrHL();clearPkts();
      valCtr('a1',n);valCtr('a2','?');valCtr('f1',n);valCtr('f2','?');
      hiCtr('a1','dim');hiCtr('a2','dim');hiCtr('f1','hE');hiCtr('f2','hS');
      hl('fl2','f');hl('fl3','f');boxHi(false,true);
      setNote('<code>res</code> y <code>resultado</code> <strong>comparten el mismo contenedor</strong>.');
      setMsg(3,TOTAL,'La función calcula x * 3 y lo escribe en res',`<code>x = ${n}</code> (copia recibida). La función calcula <code>${n} * 3 = ${r}</code> y lo asigna a <code>res</code>. Como es parámetro S, está <strong>vinculado</strong> directamente al contenedor <code>resultado</code> del algoritmo.`);
    },
    ()=>{ clrHL();clearPkts();
      valCtr('a1',n);valCtr('a2',r);valCtr('f1',n);valCtr('f2',r);
      hiCtr('a1','dim');hiCtr('a2','hS');hiCtr('f1','dim');hiCtr('f2','hS');
      hl('fl3','f');hl('fl4','f');hl('al4','a');boxHi(true,true);
      setNote('<code>res</code> y <code>resultado</code> <strong>comparten el mismo contenedor</strong>.');
      setMsg(4,TOTAL,'S escribe directamente en el contenedor del algoritmo',`Sin <code>devolver()</code>, el valor ${r} ya está en <code>resultado</code>. El parámetro S <strong>comparte el contenedor</strong> con la variable del algoritmo.`);
    },
    ()=>{ clrHL();clearPkts();setNote('');
      valCtr('a1',n);valCtr('a2',r);valCtr('f1','?');valCtr('f2','?');
      hiCtr('a1','hA');hiCtr('a2','hS');hiCtr('f1','dim');hiCtr('f2','dim');
      hl('al5','a');boxHi(true,false);
      setMsg(5,TOTAL,`Listo — resultado = ${r}, la función era void`,`<code>resultado = ${r}</code>. La función no usó <code>devolver()</code> porque es <strong>void</strong>. El resultado llegó porque el parámetro S enlazó los dos contenedores directamente.`);
    },
  ];
  return {TOTAL, init, steps};
}

function scenES(){
  const n=nVal(), r=n+10, TOTAL=7;

  function init(){
    setH('algoVars', makeCtr('a1','n',n,''));
    setH('funcVars', makeCtr('f1','x','?','ES'));
    // hide a2/f2 slots (not needed here)
    buildCode('codeA',[
      ['al0','<span class="kw">algoritmo</span> Principal'],
      ['al1','<span class="kw">var</span>  <span class="tp">entero</span>: n'],
      ['al2','<span class="kw">inicio</span>'],
      ['al3',`  n <span class="kw">&lt;--</span> ${n}`],
      ['al4',`  <span class="fn">sumar10</span>(n)`],
      ['al5','  <span class="kw">escribir</span>(n)'],
      ['al6','<span class="kw">fin</span>'],
    ]);
    buildCode('codeF',[
      ['fl0','<span class="kw2">void</span> <span class="kw2">funcion</span> <span class="fn">sumar10</span>'],
      ['fl1','  (<span class="kw">E/S</span> <span class="tp">entero</span>: x)'],
      ['fl2','<span class="kw2">inicio</span>'],
      ['fl3','  x <span class="kw">&lt;--</span> x + 10'],
      ['fl4','<span class="kw2">fin_funcion</span>'],
    ]);
    setT('funcTitle','Función sumar10');
    clearPkts(); setNote(''); clrHL(); boxHi(false,false);
  }

  const steps=[
    ()=>{ clrHL();clearPkts();setNote('');
      valCtr('a1',n);valCtr('f1','?');
      hiCtr('a1','hA');hiCtr('f1','dim');
      hl('al1','a');hl('al2','a');hl('al3','a');boxHi(true,false);
      setMsg(0,TOTAL,'Variable del algoritmo declarada',`El algoritmo asigna <code>n = ${n}</code>. La función <strong>sumar10</strong> no ha sido invocada aún.`);
    },
    ()=>{ clrHL();clearPkts();setNote('');
      valCtr('a1',n);valCtr('f1','?');
      hiCtr('a1','hES');hiCtr('f1','dim');
      hl('al4','a');boxHi(true,false);
      setMsg(1,TOTAL,'El algoritmo llama a sumar10(n) — parámetro E/S',`La llamada pasa <code>n</code> como parámetro <strong>E/S</strong>. La función recibirá el valor actual <em>y además</em> cualquier modificación que haga volverá al contenedor original.`);
    },
    ()=>{ clrHL();clearPkts();setNote('');
      valCtr('a1',n);valCtr('f1','?');
      hiCtr('a1','hES');hiCtr('f1','dim');
      showPkt(1,true,'pkES','E/S →','🔄',`valor: ${n}`);
      hl('al4','a');hl('fl0','f');hl('fl1','f');boxHi(true,true);
      setMsg(2,TOTAL,'El valor entra — y el canal queda abierto en ambos sentidos',`El valor ${n} entra a la función como <code>x</code>. A diferencia de E, el canal permanece <strong>abierto en ambas direcciones</strong>: lo que la función escriba en <code>x</code> volverá a <code>n</code>.`);
    },
    ()=>{ clrHL();clearPkts();
      valCtr('a1',n);valCtr('f1',n);
      hiCtr('a1','hES');hiCtr('f1','hES');
      hl('fl2','f');boxHi(false,true);
      setNote('<code>x</code> y <code>n</code> comparten el mismo contenedor (E/S).');
      setMsg(3,TOTAL,'La función tiene el valor inicial de n',`<code>x = ${n}</code>. Como es E/S, la función recibió el valor de entrada. Ahora va a modificarlo.`);
    },
    ()=>{ clrHL();clearPkts();
      valCtr('a1',n);valCtr('f1',r);
      hiCtr('a1','hES');hiCtr('f1','hES');
      hl('fl3','f');boxHi(false,true);
      setNote('Modificar <code>x</code> modifica <code>n</code> al mismo tiempo.');
      setMsg(4,TOTAL,`La función calcula x + 10 = ${r}`,`Se ejecuta <code>x &lt;-- x + 10</code>. El contenedor de la función muestra ${r}. Como es E/S, <code>n</code> en el algoritmo <strong>cambiará en cuanto la función termine</strong>.`);
    },
    ()=>{ clrHL();clearPkts();setNote('');
      valCtr('a1',n);valCtr('f1',r);
      hiCtr('a1','hES');hiCtr('f1','dim');
      showPkt(1,true,'pkES','← E/S','🔄',`nuevo: ${r}`);
      hl('fl4','f');hl('al4','a');boxHi(true,true);
      setMsg(5,TOTAL,'El valor modificado vuelve al contenedor original',`Al terminar la función, el valor ${r} <strong>sobreescribe</strong> el contenedor <code>n</code> del algoritmo. No es un retorno explícito — es la característica propia del parámetro E/S.`);
    },
    ()=>{ clrHL();clearPkts();setNote('');
      valCtr('a1',r);valCtr('f1','?');
      hiCtr('a1','hES');hiCtr('f1','dim');
      hl('al5','a');boxHi(true,false);
      setMsg(6,TOTAL,`Listo — n ahora vale ${r}`,`<code>n = ${r}</code>. El contenedor original del algoritmo fue <strong>modificado directamente</strong> por la función. Esto es lo que distingue E/S de E: con E la función solo lee; con E/S también escribe de vuelta.`);
    },
  ];
  return {TOTAL, init, steps};
}

// ════════ ENGINE ════════
const scenFns = {E: scenE, S: scenS, ES: scenES};
const cfgMeta = {
  E: {
    title:'Parámetro E — Entrada + devolver()',
    b1:{t:'E — entrada (copia)',s:'background:var(--e-bg);color:var(--e-dk);'},
    b2:{t:'devolver()',s:'background:var(--rt-bg);color:var(--rt-dk);'},
  },
  S: {
    title:'Parámetro S — Salida',
    b1:{t:'E — entrada (copia)',s:'background:var(--e-bg);color:var(--e-dk);'},
    b2:{t:'S — salida (escribe en original)',s:'background:var(--s-bg);color:var(--s-dk);'},
  },
  ES: {
    title:'Parámetro E/S — Entrada y Salida',
    b1:{t:'E/S — bidireccional',s:'background:var(--es-bg);color:var(--es-dk);'},
    b2:{t:'void — sin devolver()',s:'background:var(--sf2);color:var(--tx2);'},
  },
};

let sc='E', step=0, cur=null;

function selectSc(k){
  sc=k; step=0;
  ['E','S','ES'].forEach(x=>{
    g('btn'+x).className='sel-btn'+(x===k?' a'+k:'');
  });
  const m=cfgMeta[k];
  setT('scTitle',m.title);
  const b1=g('scB1'),b2=g('scB2');
  b1.textContent=m.b1.t; b1.style.cssText=m.b1.s;
  b2.textContent=m.b2.t; b2.style.cssText=m.b2.s;
  cur=scenFns[k]();
  cur.init();
  cur.steps[0]();
  renderDots(0,cur.TOTAL);
  updateBtns();
}

function resetCur(){ selectSc(sc); }

function go(d){
  step=Math.max(0,Math.min(cur.TOTAL-1,step+d));
  cur.steps[step]();
  renderDots(step,cur.TOTAL);
  updateBtns();
}

function updateBtns(){
  g('btnPrev').disabled=step===0;
  const last=step===cur.TOTAL-1;
  g('btnNext').disabled=last;
  g('btnNext').textContent=last?'✓ Completado':'Siguiente paso →';
}

selectSc('E');
</script>
